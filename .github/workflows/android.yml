name: Android build

# Builds a real, installable APK on GitHub's runners.
#
# The authoring sandbox for this project has no JDK, no Gradle and no Android
# SDK, and cannot reach dl.google.com or services.gradle.org, so the APK cannot
# be produced there. These runners have all three, which makes this the only
# honest way to ship an actual artefact rather than claiming one exists.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Also publish the APK to a GitHub Release'
        type: boolean
        default: true
  push:
    branches:
      - arena/fc3d5307-arena-ai-agent
    paths:
      - 'src/**'
      - 'android/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'

# Creating a Release needs write access to repo contents.
permissions:
  contents: write

# One build per branch; a newer push supersedes a running build.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # AGP 8.2.1 requires JDK 17 specifically.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the exact locked dependency tree
        run: npm ci

      # Gates the build on the religious content being complete and correctly
      # attributed. A partial Quran or an unsourced du'a must fail the build.
      - name: Verify bundled content
        run: npm run data:verify

      - name: Typecheck and build the web bundle
        run: npm run build

      # Regenerates android/app/src/main/assets/public, which is gitignored
      # build output and therefore absent from a fresh checkout.
      - name: Sync web assets and plugins into the Android project
        run: npx cap sync android

      - name: Grant the Gradle wrapper the executable bit
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # android/keystore.properties is deliberately absent from the repo, so
      # build.gradle falls back to the debug keystore and logs a warning.
      - name: Assemble the debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Locate the APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::Gradle reported success but produced no APK"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$APK" | cut -f1)" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nur-al-iman-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish to a GitHub Release
        if: ${{ inputs.publish_release != false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          # Notes go through a file rather than --notes: a multi-line string
          # there would need every line indented to stay inside this block
          # scalar, which is fragile and easy to break silently.
          {
            echo "Debug build from commit ${GITHUB_SHA::7}."
            echo ""
            echo "Signed with the Android **debug** keystore: installable for testing,"
            echo "not for distribution, and it cannot be upgraded to a release build"
            echo "in place."
            echo ""
            echo "- APK: ${{ steps.apk.outputs.name }}"
            echo "- Size: ${{ steps.apk.outputs.size }}"
            echo "- SHA-256: ${{ steps.apk.outputs.sha256 }}"
            echo ""
            echo "Content checks passed before packaging (npm run data:verify, 13/13)."
          } > /tmp/release-notes.md
          gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
            --title "Nur Al-Iman debug APK ($TAG)" \
            --notes-file /tmp/release-notes.md \
            --target "$GITHUB_SHA"
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"

      - name: Build summary
        run: |
          {
            echo "### Android build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| APK | \`${{ steps.apk.outputs.name }}\` |"
            echo "| Size | ${{ steps.apk.outputs.size }} |"
            echo "| SHA-256 | \`${{ steps.apk.outputs.sha256 }}\` |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Signing | debug keystore (not distributable) |"
          } >> "$GITHUB_STEP_SUMMARY"
