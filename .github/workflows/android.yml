name: Android build

# Builds a real, installable APK on GitHub's runners.
#
# The authoring sandbox for this project has no JDK, no Gradle and no Android
# SDK, and cannot reach dl.google.com or services.gradle.org, so the APK cannot
# be produced there. These runners have all three, which makes this the only
# honest way to ship an actual artefact rather than claiming one exists.
#
# Diagnostic note: this repo's job logs are stored on a blob host that is not
# reachable from the authoring sandbox, so logs cannot be read there. Every
# step that can fail therefore emits an ::error:: annotation carrying the
# relevant detail, because annotations ARE readable through the API.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Also publish the APK to a GitHub Release'
        type: boolean
        default: true
  push:
    branches:
      - arena/fc3d5307-arena-ai-agent
    paths:
      - 'src/**'
      - 'android/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'

# Creating a Release needs write access to repo contents.
permissions:
  contents: write

# One build per branch; a newer push supersedes a running build.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # AGP 8.2.1 requires JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # The ubuntu-latest runner image already ships the Android SDK with
      # ANDROID_HOME set, so no third-party setup action is used: the previous
      # android-actions/setup-android@v3 step failed outright. This verifies the
      # preinstalled SDK and reports exactly what is missing if it is not there.
      - name: Verify the preinstalled Android SDK
        run: |
          set -uo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          java -version 2>&1 | head -2
          ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
            echo "::error::No Android SDK found. ANDROID_HOME='${ANDROID_HOME:-}'"
            exit 1
          fi
          echo "--- installed platforms ---"
          ls "$ROOT/platforms" 2>/dev/null || echo "(none)"
          echo "--- installed build-tools ---"
          ls "$ROOT/build-tools" 2>/dev/null || echo "(none)"
          # compileSdkVersion is 34; make sure that platform is present.
          if [ ! -d "$ROOT/platforms/android-34" ]; then
            echo "platform android-34 missing; installing"
            yes | "$ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" \
              || echo "::error::sdkmanager could not install platforms;android-34"
          fi
          if [ ! -d "$ROOT/platforms/android-34" ]; then
            echo "::error::platforms;android-34 is required but unavailable"
            exit 1
          fi
          echo "SDK OK at $ROOT"

      - name: Install the exact locked dependency tree
        run: npm ci

      # Gates the build on the religious content being complete and correctly
      # attributed. A partial Quran or an unsourced du'a must fail the build.
      - name: Verify bundled content
        run: |
          if ! npm run data:verify; then
            echo "::error::Content verification failed — refusing to package an incomplete Quran or unsourced content"
            exit 1
          fi

      - name: Typecheck and build the web bundle
        run: |
          if ! npm run build; then
            echo "::error::Web build or typecheck failed"
            exit 1
          fi
          if [ ! -f dist/index.html ]; then
            echo "::error::Build reported success but dist/index.html is missing"
            exit 1
          fi

      # Regenerates android/app/src/main/assets/public, which is gitignored
      # build output and therefore absent from a fresh checkout.
      - name: Sync web assets and plugins into the Android project
        run: |
          if ! npx cap sync android; then
            echo "::error::cap sync android failed"
            exit 1
          fi
          if [ ! -f android/app/src/main/assets/public/index.html ]; then
            echo "::error::cap sync ran but the web assets were not copied into the Android project"
            exit 1
          fi

      - name: Grant the Gradle wrapper the executable bit
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # android/keystore.properties is deliberately absent from the repo, so
      # build.gradle falls back to the debug keystore and logs a warning.
      - name: Assemble the debug APK
        working-directory: android
        run: |
          set -o pipefail
          # tee to a file so the tail can be surfaced as an annotation, since
          # the raw job logs are not reachable from the authoring sandbox.
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee /tmp/gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Annotation text must stay on one line to be readable.
            tail -40 /tmp/gradle.log | tr '\n' ' ' | sed 's/  */ /g' \
              | sed 's/^/::error::Gradle assembleDebug failed (exit '"$status"'): /'
            exit "$status"
          fi

      - name: Locate the APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::Gradle reported success but produced no APK under android/app/build/outputs/apk"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$APK" | cut -f1)" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"
          echo "Built $APK"

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nur-al-iman-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish to a GitHub Release
        if: ${{ inputs.publish_release != false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          # Notes go through a file rather than --notes: a multi-line string
          # there would need every line indented to stay inside this block
          # scalar, which is fragile and easy to break silently.
          {
            echo "Debug build from commit ${GITHUB_SHA::7}."
            echo ""
            echo "Signed with the Android **debug** keystore: installable for testing,"
            echo "not for distribution, and it cannot be upgraded to a release build"
            echo "in place."
            echo ""
            echo "- APK: ${{ steps.apk.outputs.name }}"
            echo "- Size: ${{ steps.apk.outputs.size }}"
            echo "- SHA-256: ${{ steps.apk.outputs.sha256 }}"
            echo ""
            echo "Content checks passed before packaging (npm run data:verify, 13/13)."
          } > /tmp/release-notes.md
          gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
            --title "Nur Al-Iman debug APK ($TAG)" \
            --notes-file /tmp/release-notes.md \
            --target "$GITHUB_SHA"
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"

      - name: Build summary
        run: |
          {
            echo "### Android build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| APK | \`${{ steps.apk.outputs.name }}\` |"
            echo "| Size | ${{ steps.apk.outputs.size }} |"
            echo "| SHA-256 | \`${{ steps.apk.outputs.sha256 }}\` |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Signing | debug keystore (not distributable) |"
          } >> "$GITHUB_STEP_SUMMARY"
