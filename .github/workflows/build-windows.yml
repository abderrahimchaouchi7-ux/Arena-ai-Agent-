name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0e948-arena-ai-agent
    paths:
      - "arabic_parser/**"
      - "web/**"
      - "models/**"
      - "assets/**"
      - "main.py"
      - "Mi3rab.spec"
      - "version_info.txt"
      - "requirements*.txt"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "arabic_parser/**"
      - "web/**"
      - "models/**"
      - "main.py"
      - "Mi3rab.spec"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Run parser and API tests
        run: python -m unittest discover -s tests -v

      - name: Build Mi3rab.exe
        run: pyinstaller --noconfirm --clean Mi3rab.spec

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist/Mi3rab.exe).Hash.ToLower()
          "$hash  Mi3rab.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Mi3rab-Windows-x64
          path: |
            dist/Mi3rab.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
